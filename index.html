<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quick Symbols — Every symbol, one click away</title>
    <meta
      name="description"
      content="Tap any symbol to copy it. Quick Symbols keeps useful characters one click away."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f7f8fc" />
    <link rel="canonical" href="https://quicksymbols.example/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quick Symbols" />
    <meta property="og:title" content="Quick Symbols" />
    <meta property="og:description" content="Every symbol, one click away." />
    <meta property="og:url" content="https://quicksymbols.example/" />
    <meta property="og:image" content="https://quicksymbols.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quick Symbols surrounded by useful characters" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quick Symbols" />
    <meta name="twitter:description" content="Every symbol, one click away." />
    <meta name="twitter:image" content="https://quicksymbols.example/og-image.png" />
    <meta name="twitter:image:alt" content="Quick Symbols surrounded by useful characters" />
  </head>
  <body>
    <main id="app" class="app">
      <p id="canvas-instructions" class="visually-hidden">
        Tap or click a moving symbol to copy it. With the canvas focused, use arrow keys to choose a
        symbol and Enter or Space to copy it.
      </p>
      <canvas
        id="symbol-canvas"
        aria-label="Interactive field of copyable symbols"
        aria-describedby="canvas-instructions"
        tabindex="0"
      ></canvas>
      <div id="selection-status" class="visually-hidden" role="status" aria-live="polite"></div>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to night mode">
        <svg class="theme-icon theme-icon--moon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M20 15.1A8.4 8.4 0 0 1 8.9 4a8.5 8.5 0 1 0 11.1 11.1Z" />
        </svg>
        <svg class="theme-icon theme-icon--sun" aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3.5" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>

      <div id="copy-status" class="copy-status" role="status" aria-live="polite" aria-atomic="true"></div>

      <dialog id="conversion-dialog" class="conversion-dialog" aria-labelledby="conversion-title">
        <div class="conversion-card">
          <div class="conversion-lockup" aria-label="Quick Symbols">
            <img class="conversion-mark" src="/brand-mark.png" alt="" width="48" height="48" />
            <span class="conversion-brand" aria-hidden="true">Quick Symbols</span>
          </div>
          <h1 id="conversion-title">Want more symbols?</h1>
          <a id="extension-link" class="extension-link" href="#" target="_blank" rel="noreferrer">
            Add Quick Symbols to Chrome
          </a>
        </div>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
